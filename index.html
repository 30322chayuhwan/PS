<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG 프로젝트</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5c3d99;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #7b52cc;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 로그인 화면 -->
        <div id="login-screen">
            <h2>로그인</h2>
            <p>서비스 이용을 위해 로그인해 주세요.</p>
            <input type="email" id="email" placeholder="이메일">
            <input type="password" id="password" placeholder="비밀번호">
            <button id="btn-login">로그인</button>
            <button id="btn-register" style="background-color: #444;">회원가입</button>
        </div>

        <!-- 2. 게임 타이틀 화면 -->
        <div id="title-screen" class="hidden">
            <h1>게임 타이틀</h1>
            <p id="welcome-msg">사용자 정보</p>
            <hr style="border: 0.5px solid #444; margin: 20px 0;">
            <button id="btn-start" style="background-color: #d9534f;">게임 시작</button>
            <button id="btn-logout" style="background-color: #555; margin-top: 5px;">로그아웃</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // 본인의 파이어베이스 설정을 입력하세요.
   const firebaseConfig = {
  apiKey: "AIzaSyDlTRZ8FD3WrPyzNVxY8KumBBbwAEshwgk",
  authDomain: "paso-3aa60.firebaseapp.com",
  databaseURL: "https://paso-3aa60-default-rtdb.firebaseio.com",
  projectId: "paso-3aa60",
  storageBucket: "paso-3aa60.firebasestorage.app",
  messagingSenderId: "445073914201",
  appId: "1:445073914201:web:d45443c373c879cc0ab448",
  measurementId: "G-XNW8RT9QFW"
}; 


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginScreen = document.getElementById('login-screen');
        const titleScreen = document.getElementById('title-screen');
        const welcomeMsg = document.getElementById('welcome-msg');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // 회원가입
        document.getElementById('btn-register').addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("회원가입이 완료되었습니다.");
                })
                .catch((error) => alert("회원가입 실패: " + error.message));
        });

        // 로그인
        document.getElementById('btn-login').addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("로그인되었습니다.");
                })
                .catch((error) => alert("로그인 실패: " + error.message));
        });

        // 로그아웃
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                alert("로그아웃되었습니다.");
            });
        });

        // 게임 시작
        document.getElementById('btn-start').addEventListener('click', () => {
            alert("게임을 시작합니다.");
        });

        // 인증 상태 감지
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                titleScreen.classList.remove('hidden');
                welcomeMsg.innerText = `접속 계정: ${user.email}`;
            } else {
                loginScreen.classList.remove('hidden');
                titleScreen.classList.add('hidden');
                emailInput.value = "";
                passwordInput.value = "";
            }
        });
    </script>
</body>
</html>
