<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>도서관 판정 수정 테스트</title>
</head>
<body style="background-color: #222; padding: 50px; display: flex; justify-content: center;">

  <div id="libraryPhysicsGame" style="text-align:center; padding:20px; background:#19191e; color:#fff; border-radius:12px; max-width:420px; font-family:sans-serif; box-shadow:0 6px 20px rgba(0,0,0,0.4);">
    <h3 style="color:#ffa726; margin-top:0; font-size:18px;">📚 도서관: 이공간의 책 탑 (판정 수정본)</h3>
    
    <div style="font-style:italic; color:#dddddd; font-size:13px; line-height:1.6; text-align:left; padding:10px; background:rgba(255,255,255,0.05); border-radius:6px; margin-bottom:15px;">
      정중앙 <b>초록색 영역</b>에 빨간 바가 들어왔을 때 아래 버튼을 누르세요. (판정 범위를 넉넉하게 수정했습니다.)
    </div>
    
    <div style="position:relative; width:100%; height:30px; background:#444; border-radius:15px; margin:20px 0; overflow:hidden; border:2px solid #666;">
      <div style="position:absolute; left:35%; width:30%; height:100%; background:#2e7d32; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);"></div>
      <div id="gaugePin" style="position:absolute; left:0%; width:10px; height:100%; background:#d32f2f; box-shadow:0 0 12px #ff1744;"></div>
    </div>
    
    <div style="margin-bottom:15px; font-size:13.5px;">
      📖 빨간 수첩 추출 상태: <span id="successCount" style="color:#81c784; font-weight:bold;">0</span> / 3번 성공
    </div>
    
    <button id="actionBtn" onclick="pullNotebook()" style="background:#ffa726; color:#111; padding:14px 20px; border:none; border-radius:6px; font-weight:bold; font-size:15px; cursor:pointer; width:100%; transition:all 0.1s; active { transform: scale(0.98); }">⚠️ 지금 수첩 잡아당기기!</button>
  </div>

  <script>
    let pin = document.getElementById('gaugePin');
    let currentLeft = 0;
    let direction = 1;
    let successes = 0;
    
    // 이동 속도와 부드러움을 위해 수치 조절 (폭을 1.5로 낮추고 프레임을 매끄럽게 변경)
    let pinInterval = setInterval(() => {
      currentLeft += (1.8 * direction);
      if (currentLeft >= 97) { currentLeft = 97; direction = -1; }
      if (currentLeft <= 0) { currentLeft = 0; direction = 1; }
      pin.style.left = currentLeft + '%';
    }, 16);

    function pullNotebook() {
      // 판정 범위를 35% ~ 65%로 넓혀서 마우스 클릭 딜레이를 커버합니다.
      if (currentLeft >= 35 && currentLeft <= 65) {
        successes++;
        document.getElementById('successCount').textContent = successes;
        
        if (successes === 3) {
          clearInterval(pinInterval);
          document.getElementById('actionBtn').disabled = true;
          alert("📚 성공!\n\n탑을 무너뜨리지 않고 새빨간 가죽 수첩을 안전하게 쏙 빼냈습니다!");
        } else {
          alert("✔️ 세이프! 성공입니다. 연속해서 집중하세요!");
        }
      } else {
        // 실패 시 리셋
        alert("❌ 실패! 책 탑이 와르르 무너졌습니다.\n(무이: ……어라, 나 잠깐 졸았나?)");
        successes = 0;
        document.getElementById('successCount').textContent = "0";
        currentLeft = 0;
        direction = 1;
      }
    }
  </script>

</body>
</html>
