<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 타이틀 화면</title>
    <style>
        /* 전체 배경 및 기본 설정 */
        body {
            /* 나중에 배경 이미지를 넣으실 때 아래 주석을 풀고 경로를 수정하세요! */
            /* background-image: url('your-background-image.jpg'); */
            background-color: #1a1a1a;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-container {
            width: 80%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 좌측 메뉴 섹션 */
        .menu-section {
            display: flex;
            flex-direction: column;
            gap: 45px; /* 시작, 갤러리, 로그아웃 버튼 사이의 간격을 완벽하게 동일하게 맞춤 */
        }

        /* 개별 메뉴 버튼 스타일 (밑줄 제거 및 정렬 수정) */
        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            text-align: left; /* 좌측 정렬 확실하게 고정 */
            padding: 0;
            transition: color 0.2s, transform 0.2s;
            width: fit-content;
        }

        /* 마우스 올렸을 때의 효과 */
        .menu-btn:hover {
            color: #d9534f;
            transform: translateX(10px);
        }

        /* 로그아웃 버튼과 계정 정보를 묶어주는 래퍼 */
        .logout-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px; /* 로그아웃 글자와 이메일 사이의 간격 */
        }

        /* 하단 로그인된 계정 정보 텍스트 */
        .user-account {
            font-size: 15px;
            color: #888888;
            padding-left: 2px; /* 버튼 텍스트와 시각적 시작점을 맞추기 위한 미세 조정 */
        }

        /* 우측 타이틀 영역 */
        .title-wrapper {
            /* 배경 그림을 위해 타이틀을 위로 끌어올림 */
            transform: translateY(-80px); 
        }

        .main-title {
            font-size: 100px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.7); /* 배경 그림 위에서도 잘 보이도록 그림자 강화 */
        }
    </style>
</head>
<body>

    <div class="title-container">
        <div class="menu-section">
            <button class="menu-btn">시작</button>
            <button class="menu-btn">갤러리</button>
            
            <div class="logout-wrapper">
                <button class="menu-btn">로그아웃</button>
                <span class="user-account" id="current-user">user_account@email.com</span>
            </div>
        </div>

        <div class="title-wrapper">
            <h1 class="main-title">타이틀</h1>
        </div>
    </div>

</body>
</html>
