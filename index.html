<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 타이틀 화면</title>
    <style>
        /* 전체 배경 및 기본 설정 */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 화면 전체 레이아웃 (좌측 메뉴, 우측 타이틀 분리) */
        .title-container {
            width: 80%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between; /* 양쪽 끝으로 배치 */
            align-items: center;
        }

        /* 좌측 메뉴 섹션 */
        .menu-section {
            display: flex;
            flex-direction: column;
            gap: 40px; /* 메뉴 간격 일정하게 조정 */
        }

        /* 개별 메뉴 버튼 스타일 */
        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            padding: 0;
            transition: color 0.2s, transform 0.2s;
            width: fit-content;
        }

        /* 이미지에 있던 밑줄 효과 (시작, 갤러리에만 적용) */
        .menu-btn.underline {
            text-decoration: underline;
            text-underline-offset: 8px;
        }

        /* 마우스 올렸을 때의 효과 */
        .menu-btn:hover {
            color: #d9534f; /* TRPG에 어울리는 붉은색 포인트 */
            transform: translateX(10px); /* 오른쪽으로 살짝 이동 */
        }

        /* 로그아웃과 계정 정보를 묶는 영역 */
        .logout-group {
            display: flex;
            flex-direction: column;
            gap: 8px; /* 로그아웃 버튼과 계정 정보 사이 간격 */
            margin-top: 30px; /* 위 메뉴들과의 간격을 조금 더 띄움 */
        }

        /* 하단 로그인된 계정 정보 텍스트 (요청하신 기능) */
        .user-account {
            font-size: 15px;
            color: #888888;
            padding-left: 2px;
        }

        /* 우측 타이틀 텍스트 */
        .main-title {
            font-size: 100px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5); /* 글자 입체감 부여 */
        }
    </style>
</head>
<body>

    <div class="title-container">
        <div class="menu-section">
            <button class="menu-btn underline">시작</button>
            <button class="menu-btn underline">갤러리</button>
            
            <div class="logout-group">
                <button class="menu-btn">로그아웃</button>
                <span class="user-account" id="current-user">user_account@email.com</span>
            </div>
        </div>

        <div>
            <h1 class="main-title">타이틀</h1>
        </div>
    </div>

</body>
</html>
