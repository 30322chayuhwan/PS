<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>교무실 테스트</title>
</head>
<body style="background-color: #222; padding: 50px; display: flex; justify-content: center;">

  <div id="staffRoomPuzzle" style="text-align:center; padding:20px; background:#f8f9fa; border-radius:12px; border:1px solid #dee2e6; max-width:440px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
    <h3 style="color:#212529; margin-top:0; font-size:18px;">🖥️ 교무실 모니터 암호 해독</h3>
    
    <div style="background:#1e1e1e; color:#39ff14; padding:18px; font-family:monospace; font-size:20px; margin-bottom:12px; border-radius:6px; box-shadow: inset 0 0 10px #000;">
      [ ENCRYPTED WORD ]<br>
      <span style="color:#ffffff; font-weight:bold; letter-spacing: 3px; font-size:26px;">" NCDATKPVJ "</span>
      <div style="color:#888888; font-size:12px; margin-top:12px; font-family: sans-serif;">Sub-text: CAESAR 2</div>
    </div>

    <p style="font-style:italic; color:#495057; font-size:13.5px; line-height:1.6; margin-bottom:20px; text-align:left; padding:0 10px;">
      "N에서 두 칸 앞으로 당기면 L이고…… 알파벳을 하나씩 당겨서 조합하면 원래 단어가 나오겠지."
    </p>
    
    <input type="text" id="puzzleInput" placeholder="해독한 영어 단어 입력" style="width:200px; padding:10px; text-align:center; font-size:15px; margin-bottom:12px; border:1px solid #ced4da; border-radius:4px; text-transform: uppercase;"><br>
    <button onclick="checkCaesarPassword()" style="background:#212529; color:white; padding:10px 20px; border:none; border-radius:4px; font-size:14px; cursor:pointer; font-weight:bold; width:222px;">엔터(Enter)</button>
  </div>

  <script>
    function checkCaesarPassword() {
      const userAnswer = document.getElementById('puzzleInput').value.trim().toUpperCase();
      
      // 정답: NCDATKPVJ를 왼쪽으로 2칸씩 당기면 -> LABYRINTH
      if (userAnswer === "LABYRINTH") {
        alert("🖥️ [Access Granted]\n잠금이 해제되었습니다!\n\n화면에 최종 범인을 특정할 수 있는 [교무실 단서]가 나타났습니다.\n무이는 이 내용을 수첩에 메모했습니다.");
      } else {
        alert("❌ [Access Denied]\n올바르지 않은 입력값입니다.");
      }
    }
  </script>

</body>
</html>
